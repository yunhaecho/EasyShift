name : Lint PR

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          
      - name: Install dependencies
        run: yarn install

      - name: Run Eslint
        run: yarn eslint --ext .js,.jsx,.ts,.tsx --output-file eslint-report.json --format json
        
      - name: Upload Eslint Report on Failure
        if: failure()
        uses: actions/upload-artifact@v2
        with:
          name: eslint-report
          path: eslint-report.json
          
      - name: Run Build
        run: yarn build
